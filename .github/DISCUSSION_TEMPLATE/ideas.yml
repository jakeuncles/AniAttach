title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new feature or a change to AniAttach. One idea per discussion, so it can be voted on (upvote the ones you want).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The scene or animation you are working on and where AniAttach gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it would work for you, e.g. a new button or menu item, something in the AniAttach Timeline pane, a new option.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How you do it now
      description: Any workaround you use today, in AniAttach, Daz Studio or another plugin.
  - type: input
    id: plugin-version
    attributes:
      label: "AniAttach version"
      placeholder: "1.1.0"
